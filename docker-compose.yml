services:
  ai-service:
    build:
      context: ./ai_service
    container_name: englow-ai-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      AI_SERVICE_ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-development}
      AI_SERVICE_INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_API_KEY}
      AI_SERVICE_LLM_ENABLED: ${AI_SERVICE_LLM_ENABLED:-false}
      AI_SERVICE_LLM_BASE_URL: ${AI_SERVICE_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      AI_SERVICE_LLM_API_KEY: ${AI_SERVICE_LLM_API_KEY:-}
      AI_SERVICE_SPEECH_ENABLED: ${AI_SERVICE_SPEECH_ENABLED:-false}
      AI_SERVICE_AZURE_SPEECH_BASE_URL: ${AI_SERVICE_AZURE_SPEECH_BASE_URL:-https://example.cognitiveservices.azure.com}
      AI_SERVICE_AZURE_SPEECH_API_KEY: ${AI_SERVICE_AZURE_SPEECH_API_KEY:-}
      AI_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AI_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
      AI_SERVICE_READ_TIMEOUT_SECONDS: ${AI_SERVICE_READ_TIMEOUT_SECONDS:-45}
      AI_SERVICE_MAX_AUDIO_BYTES: ${AI_SERVICE_MAX_AUDIO_BYTES:-10485760}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    container_name: local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: local-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: local-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done;
      mc mb --ignore-existing local/images;
      mc mb --ignore-existing local/englow3;
      mc anonymous set download local/images;
      mc anonymous get local/images;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
