spring:
  application:
    name: englow3-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/englow3}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: englow3

  flyway:
    enabled: true
    schemas: englow3
    default-schema: englow3
    locations: classpath:db/migration

  servlet:
    multipart:
      # 12MB: the design allows up to 10MB audio for exam listening tracks.
      max-file-size: 12MB
      max-request-size: 12MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI}
          jwk-set-uri: ${SUPABASE_JWKS_URI}
          jws-algorithms: ES256
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://100.104.183.3:4000}

  storage:
    # One bucket per domain: the module that owns a file names its own bucket, so shared/storage never has to pick a
    # default. A third domain is one more line here and no change to ObjectStorageClient.
    avatar-bucket: ${STORAGE_AVATAR_BUCKET:avatars}
    exam-bucket: ${STORAGE_EXAM_BUCKET:exams}

    # Read side of the public bucket only - the URL a browser fetches, which is not the S3 endpoint the server signs
    # against. On Supabase the two differ in path shape, not just in host.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/avatars}

    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:ai-service}
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    internal-api-key: ${AI_SERVICE_INTERNAL_API_KEY:}
    default-model: ${AI_DEFAULT_MODEL:llama-3.3-70b-versatile}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:45s}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:100}
    worker:
      fixed-delay: ${AI_WORKER_FIXED_DELAY:2s}
      batch-size: ${AI_WORKER_BATCH_SIZE:5}
      lock-timeout: ${AI_WORKER_LOCK_TIMEOUT:5m}
      reconcile-delay: ${AI_WORKER_RECONCILE_DELAY:1m}

  speech:
    enabled: ${SPEECH_ENABLED:false}
    locale: ${SPEECH_LOCALE:en-US}
    max-audio-bytes: ${SPEECH_MAX_AUDIO_BYTES:10485760}
    upload-url-ttl: ${SPEECH_UPLOAD_URL_TTL:10m}
    retention: ${SPEECH_AUDIO_RETENTION:30d}

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
