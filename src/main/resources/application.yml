spring:
  application:
    name: englow3-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/englow3}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: englow3

  flyway:
    enabled: true
    schemas: englow3
    default-schema: englow3
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI}
          jwk-set-uri: ${SUPABASE_JWKS_URI}
          jws-algorithms: ES256
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  storage:
    public-bucket: ${STORAGE_PUBLIC_BUCKET:images}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/images}

    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:englow3}

  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${AI_API_KEY:}
    default-model: ${AI_DEFAULT_MODEL:llama-3.3-70b-versatile}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:45s}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:100}
    worker:
      fixed-delay: ${AI_WORKER_FIXED_DELAY:2s}
      batch-size: ${AI_WORKER_BATCH_SIZE:5}
      lock-timeout: ${AI_WORKER_LOCK_TIMEOUT:5m}
      reconcile-delay: ${AI_WORKER_RECONCILE_DELAY:1m}

  speech:
    enabled: ${SPEECH_ENABLED:false}
    base-url: ${AZURE_SPEECH_BASE_URL:https://example.cognitiveservices.azure.com}
    api-key: ${AZURE_SPEECH_API_KEY:}
    locale: ${SPEECH_LOCALE:en-US}
    read-timeout: ${SPEECH_READ_TIMEOUT:45s}
    max-audio-bytes: ${SPEECH_MAX_AUDIO_BYTES:10485760}
    upload-url-ttl: ${SPEECH_UPLOAD_URL_TTL:10m}
    retention: ${SPEECH_AUDIO_RETENTION:30d}

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
