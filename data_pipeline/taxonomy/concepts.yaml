# =============================================================================
# CONCEPT TAXONOMY — Englow3
# Phase 1 của docs/AGENT_WORK_ORDER_ENGLISH_DATA_PIPELINE.md
# =============================================================================
#
# Đây là xương sống của BKT. Mọi mastery của học viên được cập nhật lên concept_id
# trong file này.
#
# ⚠️  concept_id ỔN ĐỊNH VĨNH VIỄN. Đổi tên một id = xoá sạch lịch sử mastery của
#     mọi học viên trên concept đó. Thêm mới thì được, đổi/xoá thì không.
#
# bkt_priors:
#   p_init   xác suất học viên đã biết concept này trước khi học
#   p_learn  xác suất học được sau 1 lần gặp
#   p_slip   biết nhưng vẫn làm sai
#   p_guess  không biết nhưng đoán đúng
#
# Quy ước p_guess — validators/check_taxonomy.py cưỡng chế:
#   0.33  concept đánh giá bằng MCQ 3 lựa chọn (TOEIC-format Part 2)
#   0.25  concept đánh giá bằng MCQ 4 lựa chọn (mặc định)
#   0.05  concept kỹ năng sản sinh (speaking/writing) — chấm bằng rubric, không đoán được
#
# Quy ước p_init/p_learn theo band thấp nhất trong cefr_band:
#   A1 → 0.40/0.22   A2 → 0.30/0.20   B1 → 0.22/0.16   B2 → 0.15/0.12   C1 → 0.10/0.10
#
# p_slip mặc định 0.10. Nâng lên 0.15 ở các điểm người Việt sai dai dẳng kể cả khi
# đã hiểu quy tắc: article, -s số nhiều, -s ngôi 3, present perfect vs past simple,
# giới từ đi kèm, word form.
#
# Node CÓ CON là node gom nhóm (container): không gắn item trực tiếp, không kỳ vọng
# đạt ngưỡng 10–30 item. Item gắn vào node LÁ.
#
# =============================================================================

