name: Backend CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Trigger Render Deploy Hook
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_DEPLOY_HOOK_URL != '' || secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Call Render Deploy Hook
        run: |
          DEPLOY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL || vars.RENDER_DEPLOY_HOOK_URL }}"
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment..."
            curl -s -X POST "$DEPLOY_HOOK"
            echo "Render deploy triggered successfully."
          else
            echo "No Render Deploy Hook URL provided, skipping."
          fi

  deploy-vps:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker stop englow3-be || true
            docker rm englow3-be || true
            docker run -d --name englow3-be --restart always -p 8080:8080 --env-file /etc/englow3/.env ghcr.io/${{ github.repository }}:${{ github.ref_name }}

