name: Backend CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check format
        run: mvn formatter:validate

      - name: Build and test
        run: mvn --batch-mode clean verify

  ai-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/service/requirements-dev.txt

      - name: Install AI service dependencies
        run: python -m pip install -r ai/service/requirements-dev.txt

      - name: Lint AI service
        working-directory: ai/service
        run: python -m ruff check app tests

      - name: Check AI service formatting
        working-directory: ai/service
        run: python -m ruff format --check app tests

      - name: Test AI service
        working-directory: ai/service
        run: python -m pytest

  data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/data_pipeline/requirements.txt

      - name: Install data-pipeline dependencies
        run: python -m pip install -r ai/data_pipeline/requirements.txt

      - name: Test data pipeline
        working-directory: ai/data_pipeline
        run: python -m pytest -q
