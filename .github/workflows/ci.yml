name: Backend CI

on:
  # testing is where work lands before dev, so it is the branch where a break
  # is cheapest to find. It was not watched at all, which made it the one
  # branch people push to and nothing checks.
  push:
    branches:
      - main
      - dev
      - testing

  pull_request:
    branches:
      - main
      - dev
      - testing

concurrency:
  # One run per branch. A validation run superseded by a newer commit is
  # worthless, and these now start a database container each.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    # The suite starts a PostgreSQL container. A container that never becomes
    # ready would otherwise hold a runner for six hours, which is the default.
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check format
        run: mvn formatter:validate

      # Testcontainers starts a real PostgreSQL and runs the migrations against
      # it, so the integration tests need Docker. ubuntu-latest provides it;
      # a self-hosted runner would have to as well.
      - name: Build and test
        run: mvn --batch-mode clean verify

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_service/requirements-dev.txt

      - name: Install AI service dependencies
        run: python -m pip install -r ai_service/requirements-dev.txt

      - name: Lint AI service
        working-directory: ai_service
        run: python -m ruff check app tests

      - name: Check AI service formatting
        working-directory: ai_service
        run: python -m ruff format --check app tests

      - name: Test AI service
        working-directory: ai_service
        run: python -m pytest

  data-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Install data-pipeline dependencies
        run: python -m pip install -r data_pipeline/requirements.txt

      - name: Test data pipeline
        working-directory: data_pipeline
        run: python -m pytest -q
