# Weekly dependency updates. Security advisories open their own pull requests
# regardless of this schedule, so a critical fix does not wait for Monday.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      aws-sdk:
        patterns: ["software.amazon.awssdk*"]
      sentry:
        patterns: ["io.sentry*"]
  - package-ecosystem: pip
    directory: /ai_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ai_service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
